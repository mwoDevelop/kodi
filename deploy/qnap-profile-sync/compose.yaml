services:
  profile-sync:
    image: ${PROFILE_SYNC_IMAGE:?set immutable image digest}
    restart: unless-stopped
    init: true
    read_only: true
    user: "${PROFILE_SYNC_UID:-10001}:${PROFILE_SYNC_GID:-10001}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - name: profile-sync-api
        target: 8765
        published: "${PROFILE_SYNC_PORT:-18765}"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - type: bind
        source: ${PROFILE_SYNC_DATA:?set data directory}
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ${PROFILE_SYNC_KEY_REGISTRY:?set key registry file}
        target: /run/profile-sync/key-registry.json
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 256m
    pids_limit: 128
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8765/ready', timeout=3))['status'] == 'ready'"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
