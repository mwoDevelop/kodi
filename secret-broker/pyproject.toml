[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kodi-secret-broker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "cryptography==49.0.0",
  "pyhpke==0.6.5",
]

[project.scripts]
kodi-secret-broker = "kodi_secret_broker.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
