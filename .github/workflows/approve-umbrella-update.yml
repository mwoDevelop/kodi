name: approve exact Umbrella update

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: approve-exact-umbrella-update
  cancel-in-progress: false

permissions:
  checks: read
  contents: read
  pull-requests: read

jobs:
  verify:
    if: github.repository == 'mwoDevelop/kodi' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.verify.outputs.eligible }}
      number: ${{ steps.verify.outputs.number }}
      head_sha: ${{ steps.verify.outputs.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Resolve and verify the single allowlisted pull request
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/testing-lock-plugin-video-umbrella
        run: |
          set -euo pipefail
          mapfile -t numbers < <(gh pr list --state open --base main --head "$BRANCH" \
            --json number --jq '.[].number')
          if [ "${#numbers[@]}" -eq 0 ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "${#numbers[@]}" -eq 1
          number="${numbers[0]}"
          gh pr view "$number" --json number,author,baseRefName,headRefName,headRefOid,isDraft,files \
            --jq '{number,author:.author.login,base:.baseRefName,head:.headRefName,head_sha:.headRefOid,draft:.isDraft,files:[.files[].path]}' \
            > pr.json
          head_sha="$(python -c 'import json; print(json.load(open("pr.json"))["head_sha"])')"
          git show origin/main:manifests/locks/testing.json > base-lock.json
          gh api "repos/$GITHUB_REPOSITORY/contents/manifests/locks/testing.json?ref=$head_sha" \
            --jq .content | tr -d '\n' | base64 --decode > head-lock.json
          gh api "repos/$GITHUB_REPOSITORY/commits/$head_sha/check-runs?per_page=100" \
            --jq '[.check_runs[] | {name,status,conclusion,head_sha}]' > checks.json
          python tools/umbrella_auto_approval.py \
            --base-lock base-lock.json --head-lock head-lock.json \
            --pr pr.json --checks checks.json --output decision.json
          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.verify.outputs.eligible == 'true'
        with:
          name: umbrella-auto-approval-${{ steps.verify.outputs.head_sha }}
          path: decision.json
          retention-days: 90

  approve:
    needs: verify
    if: >-
      needs.verify.outputs.eligible == 'true' &&
      vars.UMBRELLA_AUTO_MERGE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Authorize required PR E2E and enable native auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ needs.verify.outputs.number }}
          VERIFIED_HEAD: ${{ needs.verify.outputs.head_sha }}
        run: |
          set -euo pipefail
          current="$(gh pr view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)"
          test "$current" = "$VERIFIED_HEAD"
          branch="$(gh pr view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefName --jq .headRefName)"
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow test.yml \
            --branch "$branch" --event pull_request --limit 20 \
            --json databaseId,headSha \
            --jq ".[] | select(.headSha == \"$VERIFIED_HEAD\") | .databaseId" | head -1)"
          test -n "$run_id"
          read -r run_status run_conclusion < <(
            gh run view "$run_id" --repo "$GITHUB_REPOSITORY" \
              --json status,conclusion --jq '[.status,.conclusion] | @tsv'
          )
          if [ "$run_conclusion" = "action_required" ]; then
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/approve" > /dev/null
          elif [ "$run_status" = "completed" ] && [ "$run_conclusion" != "success" ]; then
            echo "Required PR E2E already ended with $run_conclusion"
            exit 1
          fi
          for attempt in $(seq 1 90); do
            read -r run_status run_conclusion < <(
              gh run view "$run_id" --repo "$GITHUB_REPOSITORY" \
                --json status,conclusion --jq '[.status,.conclusion] | @tsv'
            )
            [ "$run_status" = "completed" ] && break
            sleep 5
          done
          test "$run_status" = "completed"
          test "$run_conclusion" = "success"
          current="$(gh pr view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)"
          test "$current" = "$VERIFIED_HEAD"
          gh pr merge "$NUMBER" --repo "$GITHUB_REPOSITORY" --auto --merge \
            --match-head-commit "$VERIFIED_HEAD"
          for attempt in $(seq 1 12); do
            state="$(gh pr view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json state --jq .state)"
            [ "$state" = "MERGED" ] && break
            sleep 5
          done
          test "$state" = "MERGED"
          gh workflow run publish-testing.yml --repo "$GITHUB_REPOSITORY" --ref main
