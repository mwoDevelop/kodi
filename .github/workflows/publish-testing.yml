name: publish testing

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "manifests/locks/stable.json"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kodi-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.delta.outputs.publish }}
      snapshot_id: ${{ steps.snapshot.outputs.snapshot_id }}
    env:
      KODI_COMPONENT_ROOT: ${{ github.workspace }}/locked-components
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python tools/checkout_locked_components.py --output "$KODI_COMPONENT_ROOT"
      - run: tests/e2e/run.sh
      - run: python tools/build_repo.py --output dist
      - name: Detect byte-identical public output
        id: delta
        run: |
          if curl --fail --silent --show-error \
            https://mwodevelop.github.io/kodi/artifact-manifest.sha256 \
            --output public-artifact-manifest.sha256 &&
            cmp -s public-artifact-manifest.sha256 dist/artifact-manifest.sha256; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create immutable snapshot bundle
        id: snapshot
        if: steps.delta.outputs.publish == 'true'
        run: |
          python tools/snapshot_bundle.py create \
            --dist dist \
            --testing-lock manifests/locks/testing.json \
            --repository-commit "$GITHUB_SHA" \
            --output snapshot.tar > snapshot.json
          snapshot_id="$(python -c 'import json; print(json.load(open("snapshot.json"))["snapshot_id"])')"
          echo "snapshot_id=$snapshot_id" >> "$GITHUB_OUTPUT"
      - name: Upload snapshot for the isolated writer
        if: steps.delta.outputs.publish == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: testing-snapshot
          path: snapshot.tar
          retention-days: 90
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: steps.delta.outputs.publish == 'true'
        with:
          path: dist

  snapshot-writer:
    if: needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: testing-snapshot
      - name: Verify and publish without overwrite
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_ID: ${{ needs.build.outputs.snapshot_id }}
        run: |
          python tools/snapshot_bundle.py verify snapshot.tar > verified-snapshot.json
          tag="testing-snapshot-$SNAPSHOT_ID"
          if gh release view "$tag" >/dev/null 2>&1; then
            mkdir existing
            gh release download "$tag" --pattern snapshot.tar --dir existing
            cmp snapshot.tar existing/snapshot.tar
          else
            gh release create "$tag" snapshot.tar \
              --title "Kodi testing snapshot $SNAPSHOT_ID" \
              --notes "Immutable testing snapshot. Promotion requires a separate reviewed workflow."
          fi

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    if: needs.build.outputs.publish == 'true'
    needs: [build, snapshot-writer]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
