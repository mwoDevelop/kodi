name: publish testing

on:
  workflow_dispatch:
    inputs:
      force_snapshot:
        description: Create a snapshot for certification-only changes without redeploying Pages
        required: false
        type: boolean
        default: false
      dry_run:
        description: Build, test, and scan exact artifacts without snapshot or deployment
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore:
      - "manifests/locks/stable.json"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kodi-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.delta.outputs.publish }}
      snapshot: ${{ steps.delta.outputs.snapshot }}
      snapshot_id: ${{ steps.snapshot.outputs.snapshot_id }}
    env:
      KODI_COMPONENT_ROOT: ${{ github.workspace }}/locked-components
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements-ci.txt
      - run: python tools/checkout_locked_components.py --output "$KODI_COMPONENT_ROOT"
      - run: tests/e2e/run.sh
      - run: python tools/build_repo.py --output dist
      - name: Prepare exact stable promotion payload once
        run: >-
          python tools/prepare_snapshot_promotion.py
          --testing-lock manifests/locks/testing.json
          --output promotion-dist
      - name: Materialize exact normalized publication candidate
        run: |
          set -euo pipefail
          mkdir -p security-candidate/payload security-candidate/promotion
          cp -a dist/. security-candidate/payload/
          cp -a promotion-dist/. security-candidate/promotion/
          find security-candidate -type f -exec chmod 0644 {} +
      - name: Scan exact testing and promotion bytes before publication
        uses: ./.github/actions/upstream-malware-scan
        with:
          candidate-path: security-candidate
          output: security-report.json
      - name: Detect byte-identical public output
        id: delta
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          FORCE_SNAPSHOT: ${{ github.event_name == 'workflow_dispatch' && inputs.force_snapshot || false }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "snapshot=false" >> "$GITHUB_OUTPUT"
          elif curl --fail --silent --show-error \
            https://mwodevelop.github.io/kodi/artifact-manifest.sha256 \
            --output public-artifact-manifest.sha256 &&
            cmp -s public-artifact-manifest.sha256 dist/artifact-manifest.sha256; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            if [ "$FORCE_SNAPSHOT" = "true" ]; then
              echo "snapshot=true" >> "$GITHUB_OUTPUT"
            else
              echo "snapshot=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "snapshot=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create immutable snapshot bundle
        id: snapshot
        if: steps.delta.outputs.snapshot == 'true'
        run: |
          python tools/snapshot_bundle.py create \
            --dist dist \
            --testing-lock manifests/locks/testing.json \
            --repository-commit "$GITHUB_SHA" \
            --promotion-dist promotion-dist \
            --output snapshot.tar > snapshot.json
          snapshot_id="$(python -c 'import json; print(json.load(open("snapshot.json"))["snapshot_id"])')"
          echo "snapshot_id=$snapshot_id" >> "$GITHUB_OUTPUT"
      - name: Upload snapshot for the isolated writer
        if: steps.delta.outputs.snapshot == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testing-snapshot
          path: |
            snapshot.tar
            security-report.json
          retention-days: 90
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.delta.outputs.publish == 'true'
        with:
          path: dist

  snapshot-writer:
    if: needs.build.outputs.snapshot == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: testing-snapshot
      - name: Verify and publish without overwrite
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_ID: ${{ needs.build.outputs.snapshot_id }}
        run: |
          python tools/snapshot_bundle.py verify snapshot.tar > verified-snapshot.json
          mkdir verified-security-candidate
          python tools/snapshot_bundle.py extract snapshot.tar \
            --section payload \
            --output verified-security-candidate/payload >/dev/null
          python tools/snapshot_bundle.py extract snapshot.tar \
            --section promotion \
            --output verified-security-candidate/promotion >/dev/null
          scanned_at="$(
            python -c 'import json; print(json.load(open("security-report.json"))["scanned_at"])'
          )"
          python tools/upstream_security_scan.py verify \
            --candidate verified-security-candidate \
            --report security-report.json \
            --policy manifests/upstream-security.json \
            --now "$scanned_at"
          tag="testing-snapshot-$SNAPSHOT_ID"
          if gh release view "$tag" >/dev/null 2>&1; then
            mkdir existing
            gh release download "$tag" --pattern snapshot.tar --dir existing
            gh release download "$tag" --pattern security-report.json --dir existing
            cmp snapshot.tar existing/snapshot.tar
            python tools/upstream_security_scan.py verify \
              --candidate verified-security-candidate \
              --report existing/security-report.json \
              --policy manifests/upstream-security.json
          else
            gh release create "$tag" snapshot.tar security-report.json \
              --title "Kodi testing snapshot $SNAPSHOT_ID" \
              --notes "Immutable testing snapshot with content-bound malware-scan evidence. Promotion requires a separate reviewed workflow."
          fi

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    if: needs.build.outputs.publish == 'true'
    needs: [build, snapshot-writer]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
