name: Build Secret Broker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - secret-broker/**
      - .github/workflows/build-secret-broker.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Export exact tracked Secret Broker input
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/candidate-tree"
          git archive HEAD secret-broker | tar -x -C "$RUNNER_TEMP/candidate-tree"
      - name: Scan exact input before executing tests or build
        uses: ./.github/actions/upstream-malware-scan
        with:
          candidate-path: ${{ runner.temp }}/candidate-tree
          output: ${{ runner.temp }}/secret-broker-security-report.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.4.0
        with:
          python-version: "3.12"
      - run: pip install ./secret-broker pytest
      - run: pytest -q secret-broker/tests
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679fd # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: image
        with:
          context: ./secret-broker
          file: ./secret-broker/Dockerfile
          platforms: linux/amd64,linux/arm/v7
          push: true
          tags: ghcr.io/mwodevelop/kodi-secret-broker:${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Compose exact QNAP image approval
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir qnap-approval
          cp "$RUNNER_TEMP/secret-broker-security-report.json" \
            qnap-approval/secret-broker-security-report.json
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          paths = [
              "secret-broker/Dockerfile",
              "secret-broker/pyproject.toml",
              "secret-broker/src",
          ]
          tree = subprocess.check_output(
              ["git", "ls-tree", "-r", os.environ["GITHUB_SHA"], "--", *paths]
          )
          policy = json.dumps({
              "dockerfile": "secret-broker/Dockerfile",
              "platforms": ["linux/amd64", "linux/arm/v7"],
              "build_revision": False,
              "input_paths": paths,
          }, sort_keys=True, separators=(",", ":")).encode()
          report = pathlib.Path("qnap-approval/secret-broker-security-report.json")
          approval = {
              "schema": 1,
              "service": "secret-broker",
              "image": "ghcr.io/mwodevelop/kodi-secret-broker@" + os.environ["DIGEST"],
              "source_repository": os.environ["GITHUB_REPOSITORY"],
              "source_commit": os.environ["GITHUB_SHA"],
              "input_sha256": hashlib.sha256(policy + b"\0" + tree).hexdigest(),
              "platforms": ["linux/amd64", "linux/arm/v7"],
              "security_report_sha256": hashlib.sha256(report.read_bytes()).hexdigest(),
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
          }
          pathlib.Path("qnap-approval/qnap-image-approval.json").write_text(
              json.dumps(approval, indent=2, sort_keys=True) + "\n"
          )
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qnap-image-approval-secret-broker-${{ github.run_id }}-${{ github.run_attempt }}
          path: qnap-approval/
          retention-days: 90
