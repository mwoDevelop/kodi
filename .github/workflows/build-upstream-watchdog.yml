name: build upstream watchdog image

on:
  push:
    branches: [main]
    paths:
      - "deploy/qnap-upstream-watchdog/**"
      - "manifests/upstream-watchdog.json"
      - "tools/upstream_watchdog.py"
      - ".github/workflows/build-upstream-watchdog.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679fd # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: .
          file: deploy/qnap-upstream-watchdog/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ghcr.io/mwodevelop/kodi-upstream-watchdog:${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Record immutable image digest
        run: echo "${{ steps.build.outputs.digest }}"
