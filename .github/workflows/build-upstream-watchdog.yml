name: build upstream watchdog image

on:
  push:
    branches: [main]
    paths:
      - "deploy/qnap-upstream-watchdog/**"
      - "manifests/upstream-watchdog.json"
      - "tools/upstream_watchdog.py"
      - ".github/workflows/build-upstream-watchdog.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        id: build
        with:
          context: .
          file: deploy/qnap-upstream-watchdog/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ghcr.io/mwodevelop/kodi-upstream-watchdog:${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Record immutable image digest
        run: echo "${{ steps.build.outputs.digest }}"
