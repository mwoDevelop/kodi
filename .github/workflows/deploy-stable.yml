name: deploy stable

on:
  push:
    branches: [main]
    paths:
      - "manifests/locks/stable.json"
      - ".github/workflows/deploy-stable.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify and compose exact stable bytes without deployment
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kodi-pages
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.lock.outputs.deploy }}
      publish: ${{ steps.lock.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Identify snapshot-backed stable lock
        id: lock
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          schema="$(python -c 'import json; print(json.load(open("manifests/locks/stable.json"))["schema"])')"
          if [ "$schema" = "2" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            if [ "$DRY_RUN" = "true" ]; then
              echo "deploy=false" >> "$GITHUB_OUTPUT"
            else
              echo "deploy=true" >> "$GITHUB_OUTPUT"
            fi
          elif [ "$schema" = "1" ]; then
            echo "Legacy stable lock remains published; exact-snapshot migration is a separate reviewed promotion."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            exit 1
          fi
      - name: Resolve and download the exact promoted snapshot
        if: steps.lock.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          snapshot_id="$(python - <<'PY'
          import json
          lock = json.load(open("manifests/locks/stable.json"))
          if lock.get("schema") != 2 or lock.get("channel") != "stable":
              raise SystemExit("stable deployment requires a schema 2 snapshot lock")
          print(lock["source_snapshot_id"])
          PY
          )"
          case "$snapshot_id" in
            *[!0-9a-f]*|'') exit 1 ;;
          esac
          test "${#snapshot_id}" -eq 64
          gh release download "testing-snapshot-$snapshot_id" \
            --pattern snapshot.tar --output promoted-snapshot.tar
          gh release download "testing-snapshot-$snapshot_id" \
            --pattern security-report.json \
            --output promoted-security-report.json || true
      - name: Verify immutable stable provenance and locate current testing
        if: steps.lock.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/snapshot_bundle.py verify promoted-snapshot.tar \
            > promoted-snapshot.json
          snapshot_commit="$(
            python -c 'import json; print(json.load(open("promoted-snapshot.json"))["repository_commit"])'
          )"
          evidence_required=false
          if git cat-file -e \
            "$snapshot_commit:manifests/upstream-security.json" 2>/dev/null; then
            evidence_required=true
          fi
          if [ -f promoted-security-report.json ]; then
            mkdir promoted-security-candidate
            python tools/snapshot_bundle.py extract promoted-snapshot.tar \
              --section payload \
              --output promoted-security-candidate/payload >/dev/null
            python tools/snapshot_bundle.py extract promoted-snapshot.tar \
              --section promotion \
              --output promoted-security-candidate/promotion >/dev/null
            scanned_at="$(
              python -c 'import json; print(json.load(open("promoted-security-report.json"))["scanned_at"])'
            )"
            python tools/upstream_security_scan.py verify \
              --candidate promoted-security-candidate \
              --report promoted-security-report.json \
              --policy manifests/upstream-security.json \
              --now "$scanned_at"
          elif [ "$evidence_required" = true ]; then
            echo "Scanner evidence is mandatory for this snapshot generation"
            exit 1
          else
            echo "Grandfathering a snapshot created before the scanner policy"
          fi
          curl --fail --silent --show-error \
            https://mwodevelop.github.io/kodi/testing/omega/addons.xml \
            --output public-testing-addons.xml
          python - <<'PY'
          import hashlib
          import json

          lock = json.load(open("manifests/locks/stable.json"))
          snapshot = json.load(open("promoted-snapshot.json"))
          expected = {
              "source_snapshot_id": snapshot["snapshot_id"],
              "source_index_sha256": snapshot["testing_index_sha256"],
              "source_artifact_manifest_sha256":
                  snapshot["promotion_artifact_manifest_sha256"],
          }
          for field, value in expected.items():
              if lock.get(field) != value:
                  raise SystemExit("stable lock %s does not match snapshot" % field)
          print(hashlib.sha256(
              open("public-testing-addons.xml", "rb").read()
          ).hexdigest())
          PY
          public_index="$(
            python -c 'import hashlib; print(hashlib.sha256(open("public-testing-addons.xml", "rb").read()).hexdigest())'
          )"
          mkdir current-snapshot-candidates
          found=false
          while read -r tag; do
            candidate_id="${tag#testing-snapshot-}"
            case "$candidate_id" in
              *[!0-9a-f]*|'') continue ;;
            esac
            test "${#candidate_id}" -eq 64 || continue
            candidate_dir="current-snapshot-candidates/$tag"
            mkdir "$candidate_dir"
            gh release download "$tag" --pattern snapshot.tar \
              --dir "$candidate_dir"
            if python tools/snapshot_bundle.py verify \
              "$candidate_dir/snapshot.tar" > "$candidate_dir/snapshot.json" &&
              test "$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["testing_index_sha256"])' "$candidate_dir/snapshot.json")" = "$public_index"; then
              cp "$candidate_dir/snapshot.tar" current-testing-snapshot.tar
              found=true
              break
            fi
          done < <(
            gh release list --limit 100 --json tagName \
              --jq '.[].tagName | select(startswith("testing-snapshot-"))'
          )
          test "$found" = true
      - name: Compose current testing with exact prebuilt stable
        if: steps.lock.outputs.publish == 'true'
        run: |
          python tools/compose_stable_snapshot.py \
            --current-testing-snapshot current-testing-snapshot.tar \
            --promoted-stable-snapshot promoted-snapshot.tar \
            --output dist > composed-snapshot.json
          python - <<'PY'
          import hashlib
          import json

          public_testing = hashlib.sha256(
              open("public-testing-addons.xml", "rb").read()
          ).hexdigest()
          composed_testing = hashlib.sha256(
              open("dist/testing/omega/addons.xml", "rb").read()
          ).hexdigest()
          if public_testing != composed_testing:
              raise SystemExit("composer did not preserve current testing")
          PY
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.lock.outputs.deploy == 'true'
        with:
          path: dist

  deploy:
    needs: materialize
    if: needs.materialize.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
