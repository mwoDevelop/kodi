name: reconcile upstreams

on:
  workflow_dispatch:
  schedule:
    - cron: "20 4 * * *"

concurrency:
  group: upstream-reconciliation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate control-plane manifests
        run: python -m tools.upstream_sync.cli validate-config
      - name: Discover immutable upstream state
        run: >-
          python -m tools.upstream_sync.cli discover
          --output upstream-discovery.json
          --markdown upstream-discovery.md
      - name: Publish read-only report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upstream-discovery
          path: |
            upstream-discovery.json
            upstream-discovery.md
          retention-days: 14

  report:
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: upstream-discovery
      - name: Reconcile managed source issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          action="$(python -c 'import json; p=json.load(open("upstream-discovery.json")); print("noop" if all(x["action"] == "noop" for x in p["sources"]) else "review")')"
          title="Managed upstream reconciliation"
          issue="$(gh issue list --state open --search "$title in:title" --json number,title --jq '.[] | select(.title == "'"$title"'") | .number' | head -n 1)"
          if [ "$action" = "noop" ]; then
            if [ -n "$issue" ]; then
              gh issue close "$issue" --comment "All upstream sources recovered; current run is a no-op."
            fi
            exit 0
          fi
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --body-file upstream-discovery.md
          else
            gh issue create --title "$title" --body-file upstream-discovery.md
          fi

  prepare-testing-lock:
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      action: ${{ steps.candidate.outputs.action }}
      base_commit: ${{ steps.candidate.outputs.base_commit }}
      candidate_id: ${{ steps.candidate.outputs.candidate_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Prepare typed testing-lock candidate
        run: python tools/testing_lock_candidate.py prepare --output candidate
      - name: Export candidate
        id: candidate
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          value = json.loads(Path("candidate/candidate.json").read_text())
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              for key in ("action", "base_commit", "candidate_id"):
                  output.write("%s=%s\n" % (key, value[key]))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: testing-lock-candidate
          path: candidate/
          retention-days: 7

  propose-testing-lock:
    needs: prepare-testing-lock
    if: needs.prepare-testing-lock.outputs.action == 'propose'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-testing-lock.outputs.base_commit }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: testing-lock-candidate
          path: candidate
      - name: Verify and apply exact lock only
        run: >-
          python tools/testing_lock_candidate.py apply
          --bundle candidate
          --checkout .
      - name: Open or update testing-lock PR and ensure E2E
        env:
          BASE_COMMIT: ${{ needs.prepare-testing-lock.outputs.base_commit }}
          BRANCH: automation/testing-lock
          CANDIDATE_ID: ${{ needs.prepare-testing-lock.outputs.candidate_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_COMMIT"
          git config user.name "mwoDevelop update bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add manifests/locks/testing.json
          git diff --cached --quiet && { echo "Candidate produced no lock change"; exit 1; }
          git commit -m "Update exact testing component lock" \
            -m "Candidate-ID: $CANDIDATE_ID"
          git fetch origin "$BRANCH:refs/remotes/origin/$BRANCH" || true
          remote_sha="$(git show-ref --hash "refs/remotes/origin/$BRANCH" 2>/dev/null || true)"
          if [ -n "$remote_sha" ]; then
            git push origin "HEAD:refs/heads/$BRANCH" \
              "--force-with-lease=refs/heads/$BRANCH:$remote_sha"
          else
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
          body="Automated exact testing-lock update. Candidate-ID: \`$CANDIDATE_ID\`. Component code was already merged to protected product branches."
          number="$(gh pr list --state open --head "$BRANCH" --base main --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "Update exact testing component lock" --body "$body"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "Update exact testing component lock" --body "$body"
          fi
          head_sha="$(git rev-parse HEAD)"
          gh workflow run test.yml --ref "$BRANCH"
          found=false
          for attempt in $(seq 1 15); do
            run_head="$(gh run list --workflow test.yml --branch "$BRANCH" \
              --event workflow_dispatch --limit 1 --json headSha \
              --jq '.[0].headSha // empty')"
            if [ "$run_head" = "$head_sha" ]; then
              found=true
              break
            fi
            sleep 2
          done
          test "$found" = true
