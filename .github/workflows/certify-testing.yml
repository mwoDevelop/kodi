name: certify testing on Kodi devices

on:
  workflow_dispatch:
    inputs:
      snapshot_id:
        description: Exact published testing snapshot ID
        required: true
        type: string
      android_tv:
        description: Logical Android TV canary
        required: false
        default: x88pro20
        type: string

concurrency:
  group: certify-${{ inputs.snapshot_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  device-matrix:
    if: >-
      github.repository == 'mwoDevelop/kodi' &&
      github.ref == 'refs/heads/main'
    environment: testing-certification
    runs-on: [self-hosted, kodi-device-e2e]
    outputs:
      repository_commit: ${{ steps.identity.outputs.repository_commit }}
      attestation_id: ${{ steps.attestation.outputs.attestation_id }}
      attestation_sha256: ${{ steps.attestation.outputs.attestation_sha256 }}
      attestation_filename: ${{ steps.attestation.outputs.attestation_filename }}
      artifact_name: ${{ steps.attestation.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download immutable public testing snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_ID: ${{ inputs.snapshot_id }}
        run: |
          case "$SNAPSHOT_ID" in
            *[!0-9a-f]*|'') exit 1 ;;
          esac
          test "${#SNAPSHOT_ID}" -eq 64
          gh release download "testing-snapshot-$SNAPSHOT_ID" \
            --pattern snapshot.tar
          python tools/snapshot_bundle.py verify snapshot.tar > snapshot.json
          test "$(python -c 'import json; print(json.load(open("snapshot.json"))["snapshot_id"])')" = "$SNAPSHOT_ID"
      - name: Use the exact scripts committed into the snapshot
        id: identity
        run: |
          commit="$(python -c 'import json; print(json.load(open("snapshot.json"))["repository_commit"])')"
          git cat-file -e "$commit^{commit}"
          git checkout --detach "$commit"
          echo "repository_commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Run the required emulator and Android TV canaries
        env:
          ANDROID_TV: ${{ inputs.android_tv }}
          KODI_ADB: ${{ vars.KODI_ADB }}
          KODI_DEVICES_FILE: ${{ vars.KODI_DEVICES_FILE }}
          KODI_REFERENCES_FILE: ${{ vars.KODI_REFERENCES_FILE }}
        run: |
          test -n "$KODI_ADB"
          test -n "$KODI_DEVICES_FILE"
          test -n "$KODI_REFERENCES_FILE"
          python tools/kodi_android_stable_rollout.py \
            --device bluestacks1 \
            --adb "$KODI_ADB" \
            --channel testing \
            --devices "$KODI_DEVICES_FILE" \
            --references "$KODI_REFERENCES_FILE"
          python tools/kodi_android_stable_rollout.py \
            --device "$ANDROID_TV" \
            --adb "$KODI_ADB" \
            --channel testing \
            --devices "$KODI_DEVICES_FILE" \
            --references "$KODI_REFERENCES_FILE"
          python tools/certify_device_matrix.py \
            --snapshot snapshot.tar \
            --adb "$KODI_ADB" \
            --devices "$KODI_DEVICES_FILE" \
            --references "$KODI_REFERENCES_FILE" \
            --device bluestacks1 \
            --device "$ANDROID_TV" \
            --output device-matrix.json
      - name: Create a short-lived replay-resistant attestation
        id: attestation
        env:
          REPOSITORY_COMMIT: ${{ steps.identity.outputs.repository_commit }}
          SNAPSHOT_ID: ${{ inputs.snapshot_id }}
        run: |
          nonce="$(openssl rand -hex 32)"
          issued_at="$(date --utc +%Y-%m-%dT%H:%M:%SZ)"
          expires_at="$(date --utc --date='+7 days' +%Y-%m-%dT%H:%M:%SZ)"
          python tools/device_attestation.py create \
            --snapshot snapshot.tar \
            --matrix device-matrix.json \
            --repository "$GITHUB_REPOSITORY" \
            --repository-commit "$REPOSITORY_COMMIT" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --runner-name "$RUNNER_NAME" \
            --nonce "$nonce" \
            --issued-at "$issued_at" \
            --expires-at "$expires_at" \
            --output device-attestation.json
          python tools/device_attestation.py verify \
            --snapshot snapshot.tar \
            --attestation device-attestation.json > /dev/null
          attestation_id="$(python -c 'import json; print(json.load(open("device-attestation.json"))["attestation_id"])')"
          filename="device-attestation-$attestation_id.json"
          mv device-attestation.json "$filename"
          echo "attestation_id=$attestation_id" >> "$GITHUB_OUTPUT"
          echo "attestation_sha256=$(sha256sum "$filename" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "attestation_filename=$filename" >> "$GITHUB_OUTPUT"
          echo "artifact_name=device-attestation-${SNAPSHOT_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.attestation.outputs.artifact_name }}
          path: ${{ steps.attestation.outputs.attestation_filename }}
          retention-days: 90

  publish-attestation:
    needs: device-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.device-matrix.outputs.repository_commit }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.device-matrix.outputs.artifact_name }}
      - name: Verify and attach once to the immutable snapshot release
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_ID: ${{ inputs.snapshot_id }}
          ATTESTATION_ID: ${{ needs.device-matrix.outputs.attestation_id }}
          ATTESTATION_SHA256: ${{ needs.device-matrix.outputs.attestation_sha256 }}
          ATTESTATION_FILENAME: ${{ needs.device-matrix.outputs.attestation_filename }}
        run: |
          gh release download "testing-snapshot-$SNAPSHOT_ID" \
            --pattern snapshot.tar
          python tools/device_attestation.py verify \
            --snapshot snapshot.tar \
            --attestation "$ATTESTATION_FILENAME" > /dev/null
          test "$(sha256sum "$ATTESTATION_FILENAME" | cut -d' ' -f1)" = "$ATTESTATION_SHA256"
          test "$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["attestation_id"])' "$ATTESTATION_FILENAME")" = "$ATTESTATION_ID"
          mkdir -p existing
          if gh release download "testing-snapshot-$SNAPSHOT_ID" \
            --pattern "$ATTESTATION_FILENAME" --dir existing 2>/dev/null; then
            cmp "$ATTESTATION_FILENAME" "existing/$ATTESTATION_FILENAME"
          else
            gh release upload "testing-snapshot-$SNAPSHOT_ID" \
              "$ATTESTATION_FILENAME"
          fi
