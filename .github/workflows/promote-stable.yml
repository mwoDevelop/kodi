name: promote stable

on:
  workflow_dispatch:
    inputs:
      testing_index_sha256:
        description: Exact SHA-256 published in testing/omega/addons.xml.sha256
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: kodi-pages
  cancel-in-progress: false

jobs:
  promote:
    environment: stable
    runs-on: ubuntu-latest
    env:
      KODI_COMPONENT_ROOT: ${{ github.workspace }}/locked-components
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python tools/checkout_locked_components.py --output "$KODI_COMPONENT_ROOT"
      - name: Fetch exact public testing candidate
        run: >-
          python tools/promote_channel.py fetch
          --base https://mwodevelop.github.io/kodi/
          --testing-lock manifests/locks/testing.json
          --expected-index-sha256 "${{ inputs.testing_index_sha256 }}"
          --output candidate
      - name: Pin candidate as stable
        run: >-
          python tools/promote_channel.py lock
          --testing-lock manifests/locks/testing.json
          --stable-lock manifests/locks/stable.json
          --candidate candidate
      - run: tests/e2e/run.sh
      - run: python tools/build_repo.py --output dist
      - name: Copy exact candidate ZIPs into stable
        run: python tools/promote_channel.py inject --dist dist --candidate candidate
      - name: Commit immutable stable lock
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add manifests/locks/stable.json
          git commit -m "Promote verified testing candidate [skip ci]"
          git push origin HEAD:main
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: promote
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
