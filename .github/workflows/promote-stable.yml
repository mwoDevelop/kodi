name: promote stable

on:
  workflow_dispatch:
    inputs:
      testing_index_sha256:
        description: Exact SHA-256 published in testing/omega/addons.xml.sha256
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: promote-stable-lock
  cancel-in-progress: false

jobs:
  promote:
    environment: stable
    runs-on: ubuntu-latest
    env:
      KODI_COMPONENT_ROOT: ${{ github.workspace }}/locked-components
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python tools/checkout_locked_components.py --output "$KODI_COMPONENT_ROOT"
      - name: Fetch exact public testing candidate
        run: >-
          python tools/promote_channel.py fetch
          --base https://mwodevelop.github.io/kodi/
          --testing-lock manifests/locks/testing.json
          --expected-index-sha256 "${{ inputs.testing_index_sha256 }}"
          --output candidate
      - name: Pin candidate as stable
        run: >-
          python tools/promote_channel.py lock
          --testing-lock manifests/locks/testing.json
          --stable-lock manifests/locks/stable.json
          --candidate candidate
      - run: tests/e2e/run.sh
      - run: python tools/build_repo.py --output dist
      - name: Copy exact candidate ZIPs into stable
        run: python tools/promote_channel.py inject --dist dist --candidate candidate
      - name: Commit immutable stable lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- manifests/locks/stable.json; then
            echo "Stable already contains this exact testing candidate."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          branch="bot/promote-stable-${{ inputs.testing_index_sha256 }}"
          branch="${branch:0:45}"
          git switch -c "$branch"
          git add manifests/locks/stable.json
          git commit -m "Promote verified testing candidate"
          git push --force-with-lease origin "$branch"
          existing="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh pr comment "$existing" --body "Candidate revalidated against exact public testing bytes."
          else
            gh pr create \
              --base main \
              --head "$branch" \
              --title "Promote verified testing candidate to stable" \
              --body "Manual promotion PR. Component ZIPs were fetched from public testing, checked against the testing lock and injected byte-for-byte. Merging changes only the stable lock; repository.mwodevelop remains version 1.0.0."
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stable-promotion-candidate
          path: candidate
          retention-days: 90
