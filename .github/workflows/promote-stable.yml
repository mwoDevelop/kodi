name: promote stable

on:
  workflow_dispatch:
    inputs:
      snapshot_id:
        description: Exact certified testing snapshot ID
        required: true
        type: string
      attestation_id:
        description: Exact immutable device attestation ID
        required: true
        type: string
      attestation_sha256:
        description: SHA-256 of the exact immutable attestation asset
        required: true
        type: string
      qnap_candidate_id:
        description: Exact immutable QNAP candidate ID
        required: true
        type: string
      qnap_candidate_sha256:
        description: SHA-256 of the exact immutable QNAP candidate asset
        required: true
        type: string

concurrency:
  group: promote-stable-lock
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    environment: stable
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      base_commit: ${{ steps.candidate.outputs.base_commit }}
      candidate_id: ${{ steps.candidate.outputs.candidate_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Download exact immutable snapshot and device attestation
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_ID: ${{ inputs.snapshot_id }}
          ATTESTATION_ID: ${{ inputs.attestation_id }}
          ATTESTATION_SHA256: ${{ inputs.attestation_sha256 }}
          QNAP_CANDIDATE_ID: ${{ inputs.qnap_candidate_id }}
          QNAP_CANDIDATE_SHA256: ${{ inputs.qnap_candidate_sha256 }}
        run: |
          case "$SNAPSHOT_ID" in
            *[!0-9a-f]*|'') exit 1 ;;
          esac
          test "${#SNAPSHOT_ID}" -eq 64
          case "$ATTESTATION_ID" in
            *[!0-9a-f]*|'') exit 1 ;;
          esac
          test "${#ATTESTATION_ID}" -eq 64
          case "$ATTESTATION_SHA256" in
            *[!0-9a-f]*|'') exit 1 ;;
          esac
          test "${#ATTESTATION_SHA256}" -eq 64
          case "$QNAP_CANDIDATE_ID" in
            *[!0-9a-f]*|'') exit 1 ;;
          esac
          test "${#QNAP_CANDIDATE_ID}" -eq 64
          case "$QNAP_CANDIDATE_SHA256" in
            *[!0-9a-f]*|'') exit 1 ;;
          esac
          test "${#QNAP_CANDIDATE_SHA256}" -eq 64
          filename="device-attestation-$ATTESTATION_ID.json"
          qnap_filename="qnap-candidate-$QNAP_CANDIDATE_ID.json"
          gh release download "testing-snapshot-$SNAPSHOT_ID" \
            --pattern snapshot.tar --pattern "$filename" \
            --pattern "$qnap_filename"
          test "$(sha256sum "$filename" | cut -d' ' -f1)" = "$ATTESTATION_SHA256"
          test "$(sha256sum "$qnap_filename" | cut -d' ' -f1)" = "$QNAP_CANDIDATE_SHA256"
          test "$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["attestation_id"])' "$filename")" = "$ATTESTATION_ID"
          mv "$filename" device-attestation.json
          mv "$qnap_filename" qnap-stable-candidate.json
      - name: Verify snapshot is still the current public testing candidate
        env:
          SNAPSHOT_ID: ${{ inputs.snapshot_id }}
        run: |
          python tools/snapshot_bundle.py verify snapshot.tar > snapshot.json
          test "$(python -c 'import json; print(json.load(open("snapshot.json"))["snapshot_id"])')" = "$SNAPSHOT_ID"
          curl --fail --silent --show-error \
            https://mwodevelop.github.io/kodi/testing/omega/addons.xml \
            --output public-testing-addons.xml
          python - <<'PY'
          import hashlib
          import json
          metadata = json.load(open("snapshot.json"))
          payload = open("public-testing-addons.xml", "rb").read()
          if hashlib.sha256(payload).hexdigest() != metadata["testing_index_sha256"]:
              raise SystemExit("selected snapshot is no longer current testing")
          PY
      - name: Prepare content-addressed stable lock candidate
        run: |
          python tools/promote_channel.py snapshot-lock \
            --snapshot snapshot.tar \
            --attestation device-attestation.json \
            --stable-lock manifests/locks/stable.json \
            --output stable-candidate
          python tools/qnap_lock.py validate \
            --lock qnap-stable-candidate.json > /dev/null
          cp qnap-stable-candidate.json stable-candidate/qnap-stable.json
      - name: Export candidate identity
        id: candidate
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          value = json.loads(Path("stable-candidate/candidate.json").read_text())
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write("base_commit=%s\n" % subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip())
              output.write("candidate_id=%s\n" % value["candidate_id"])
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stable-lock-candidate
          path: stable-candidate/
          retention-days: 90

  propose:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.verify.outputs.base_commit }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stable-lock-candidate
          path: stable-candidate
      - name: Apply only the verified stable lock
        run: |
          python tools/promote_channel.py apply-lock-candidate \
            --bundle stable-candidate \
            --stable-lock manifests/locks/stable.json
          cp stable-candidate/qnap-stable.json \
            manifests/locks/qnap-stable.json
      - name: Open reviewed stable promotion PR
        env:
          BASE_COMMIT: ${{ needs.verify.outputs.base_commit }}
          CANDIDATE_ID: ${{ needs.verify.outputs.candidate_id }}
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_ID: ${{ inputs.snapshot_id }}
          ATTESTATION_ID: ${{ inputs.attestation_id }}
          QNAP_CANDIDATE_ID: ${{ inputs.qnap_candidate_id }}
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_COMMIT"
          git config user.name "mwoDevelop promotion bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="automation/promote-stable-${SNAPSHOT_ID:0:12}"
          git checkout -B "$branch"
          git add manifests/locks/stable.json manifests/locks/qnap-stable.json
          git diff --cached --quiet && { echo "Stable already uses this snapshot"; exit 0; }
          git commit -m "Promote certified snapshot to stable" \
            -m "Snapshot-ID: $SNAPSHOT_ID" \
            -m "Candidate-ID: $CANDIDATE_ID"
          git push --force-with-lease origin "$branch"
          existing="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')"
          body="Manual exact-snapshot promotion. Snapshot: \`$SNAPSHOT_ID\`. Attestation: \`$ATTESTATION_ID\`. QNAP candidate: \`$QNAP_CANDIDATE_ID\`. Candidate-ID: \`$CANDIDATE_ID\`. Deployment copies the prepared payload without rebuilding component ZIPs or images."
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "Promote certified snapshot to stable" --body "$body"
          else
            gh pr create --base main --head "$branch" \
              --title "Promote certified snapshot to stable" --body "$body"
          fi
          gh workflow run test.yml --ref "$branch"
